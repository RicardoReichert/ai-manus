[pytest]
asyncio_mode = auto
log_cli = true
log_cli_level = info
log_cli_format = %(asctime)s %(filename)s:%(lineno)s [%(levelname)s]: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
markers =
    file_api: marks tests for file API
    models: marks tests for the model registry API and session model routes
    archive: marks tests for session archive/unarchive (TAREFA 1.5)
    usage: marks tests for session usage/rating (TAREFA 4.1)
    search: marks tests for global search (TAREFA 16.1)
    subtasks: marks tests for the Agent page subtasks endpoint (TAREFA 1.1)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning 